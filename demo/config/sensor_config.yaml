# sensor_demo YAML config. Command-line options override this file.
# width/height are fixed at 1280x1088; changing them is not supported.
camera:
  width: 1280
  height: 1088
  fps: 30
  rotate: 0
rtsp:
  bps: 4000
  codec: h264
  url: /PRR
imu:
  sample_rate_hz: 1000
  print_rate_hz: 10
  print_metrics: false
save_data:
  save: false
  save_path: /root/save_demo/record.bag
  skip: false
