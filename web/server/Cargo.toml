[package]
name = "sensor_web"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
bytes = "1.11"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
mio = { version = "1.1", features = ["os-poll", "os-ext", "net"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "signal", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
